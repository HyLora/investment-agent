[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-agent"
version = "0.1.0"
description = "Advisory InvestmentAgent: ETF portfolio monitoring with explainable LLM rebalancing suggestions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "yfinance>=0.2.40",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pyyaml>=6.0.1",
  "jinja2>=3.1.4",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
llm = ["openai>=1.30.0"]
dev = ["pytest>=8.2.0", "pytest-cov>=5.0.0"]

[project.scripts]
investment-agent = "investment_agent.main:main"

[tool.setuptools.packages.find]
include = ["investment_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
